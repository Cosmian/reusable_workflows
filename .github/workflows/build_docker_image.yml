---
name: Docker build

on:
  workflow_call:
    inputs:
      registry-image:
        required: true
        type: string
      os:
        required: true
        type: string
      features:
        required: true
        type: string
      debug_or_release:
        required: false
        type: string
        default: release

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    name: Image ${{ inputs.features }} - ${{ inputs.os }}
    runs-on: ${{ inputs.os }}

    steps:
      - name: Display cpuinfo
        run: cat /proc/cpuinfo

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download package artifacts
        id: download_artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.features }}_${{ inputs.os }}-${{ inputs.debug_or_release }}

      - name: List downloaded artifacts
        run: find .

      - name: Set Debian package path
        id: deb_path
        run: |
          set -ex
          ART_PATH="${{ steps.download_artifacts.outputs.download-path }}"
          echo "download-path: $ART_PATH"
          DEB_FILE="$(find "$ART_PATH" -type f -name '*.deb' | head -n 1)"
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb file found in $ART_PATH" >&2
            exit 1
          fi
          # Convert absolute path to relative (strip leading workspace directory if present)
          REL_DEB_FILE="${DEB_FILE##$GITHUB_WORKSPACE/}"
          echo "Resolved absolute DEB_FILE: $DEB_FILE"
          echo "Using relative DEB_FILE: $REL_DEB_FILE"
          echo "DEB_FILE_PATH=$REL_DEB_FILE" >> "$GITHUB_ENV"
          echo "deb_file_path=$REL_DEB_FILE" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Packages
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ inputs.registry-image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and tag docker container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          # platforms: ${{ inputs.os == 'ubuntu-24.04-arm' && 'linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          network: host
          build-args: |
            DEB_FILE=${{ steps.deb_path.outputs.deb_file_path }}

      - name: Display metadata version ${{ steps.meta.outputs.version }}
        run: |
          echo version: "${{ steps.meta.outputs.version }}"
          echo tags: "${{ steps.meta.outputs.tags }}"

    outputs:
      image-tag: ${{ inputs.registry-image }}:${{ steps.meta.outputs.version }}

  test-image:
    name: Test Image ${{ inputs.features }}
    needs: build-and-push-image
    runs-on: ${{ inputs.os }}
    env:
      DOCKER_IMAGE_NAME: ${{ needs.build-and-push-image.outputs.image-tag }}

    steps:
      - name: Login to GitHub Packages
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: test image
        run: |
          bash .github/scripts/test_docker_image.sh
