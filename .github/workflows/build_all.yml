---
name: Build all

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      debug_or_release:
        required: true
        type: string
  workflow_dispatch:

jobs:
  packages:
    name: Package ${{ matrix.runner }} - ${{ matrix.features }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    env:
      DOCKER_BASE_IMAGE: ${{ matrix.features == 'fips' && 'ghcr.io/cosmian/kms-fips' || 'ghcr.io/cosmian/kms' }}

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package
        run: |
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.features }}_${{ matrix.runner }}-${{ inputs.debug_or_release }}
          path: result-*-${{ matrix.features }}/*
          retention-days: 1
          if-no-files-found: error

  docker-image:
    name: Docker image build ${{ matrix.runner }} - ${{ matrix.features }}
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    uses: ./.github/workflows/build_docker_image.yml
    with:
      registry-image: ${{ (matrix.features == 'fips' && 'ghcr.io/cosmian/kms-fips' || 'ghcr.io/cosmian/kms') }}
      os: ${{ matrix.runner }}
      features: ${{ matrix.features }}
      debug_or_release: ${{ inputs.debug_or_release }}
    secrets: inherit

  packages-test:
    needs: packages
    name: Package tests ${{ matrix.container }} - ${{ matrix.features }}${{ matrix.runner == 'ubuntu-24.04-arm' && ' - ARM' || ' - AMD64' }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          # Ubuntu LTS releases within the last ~10 years
          - ubuntu:25.04
          - ubuntu:24.04
          - ubuntu:22.04
          - ubuntu:20.04
          # Cannot download artifacts using actions/download-artifact@v4 - Glibc v2.28 required
          # - ubuntu:18.04
          # Debian stable releases within the last ~10 years
          - debian:trixie-slim # Debian 13
          - debian:bookworm-slim # Debian 12
          - debian:bullseye-slim # Debian 11
          - debian:buster-slim # Debian 10
          # Cannot download artifacts using actions/download-artifact@v4 - Glibc v2.28 required
          # - debian:stretch-slim # Debian 9
          # Rocky Linux releases
          - rockylinux/rockylinux:10
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:8
        features: [fips, non-fips]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.features }}_${{ matrix.runner }}-${{ inputs.debug_or_release }}

      - name: List downloaded artifacts
        if: ${{ matrix.container != 'rockylinux/rockylinux:8' }}
        run: find .

      - name: Install package
        shell: bash
        run: |
          set -ex
          if [ "${{ startsWith(matrix.container, 'rockylinux') }}" = "true" ]; then
            # RPM-based (Rocky Linux)
            rpm -qpl ./result-rpm-${{ matrix.features }}/*.rpm
            rpm -i ./result-rpm-${{ matrix.features }}/*.rpm --nodeps || true
          else
            # DEB-based (Ubuntu/Debian)
            dpkg --contents ./result-deb-${{ matrix.features }}/*.deb
            # Use apt to handle dependencies when installing local .deb files
            dpkg -i ./result-deb-${{ matrix.features }}/*.deb || true
          fi

      - name: Enable info flag in config
        shell: bash
        run: |
          set -ex
          if [ -f /etc/cosmian/kms.toml ]; then
            sed -i 's/info = false/info = true/g' /etc/cosmian/kms.toml
          else
            echo "Config file /etc/cosmian/kms.toml not found; skipping info flag enable."
            exit 1
          fi

      - name: Pre-check file
        shell: bash
        run: |
          set -ex
          # Determine installed binary path
          BIN="/usr/sbin/cosmian_kms"
          if [ ! -x "$BIN" ]; then
            if [ -f "/usr/bin/cosmian_kms" ]; then
              BIN="/usr/bin/cosmian_kms"
            fi
          fi
          # Show libs and run
          ldd "$BIN"
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --info

      - name: Disable info flag in config
        shell: bash
        run: |
          set -ex
          if [ -f /etc/cosmian/kms.toml ]; then
            sed -i 's/info = true/info = false/g' /etc/cosmian/kms.toml
          else
            echo "Config file /etc/cosmian/kms.toml not found; skipping info flag enable."
            exit 1
          fi

      - name: Run executable file
        shell: bash
        run: |
          set -ex
          # Determine installed binary path
          BIN="/usr/sbin/cosmian_kms"
          "$BIN" &
          sleep 5

          # Test UI endpoints
          if command -v curl >/dev/null 2>&1; then
            curl -I http://127.0.0.1:9998/ui/index.html
          else
            # Last resort: pure Bash using /dev/tcp
            # Requires bash; sends a HEAD request and checks for 200
            set +e
            {
              exec 3<>/dev/tcp/127.0.0.1/9998
              printf 'HEAD /ui/index.html HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3
              read -r status_line <&3
              echo "$status_line"
              echo "$status_line" | grep -qE 'HTTP/.* 2[0-9]{2}\b'
            } ; rc=$?
            exec 3>&- 3<&-
            set -e
            exit $rc
          fi

  test-nix:
    name: Test on ${{ matrix.type }} - ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type:
          - sqlite
          - mysql
          - psql
          - google_cse
          - redis
          - pykmip
        features: [fips, non-fips]
        exclude:
          # redis is exclusively for non-fips
          - type: redis
            features: fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run docker containers
        run: |
          docker compose -h
          docker compose up -d

      - name: Test
        env:
          POSTGRES_USER: kms
          PGUSER: kms
          POSTGRES_PASSWORD: kms
          POSTGRES_DB: kms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          KMS_POSTGRES_URL: postgresql://kms:kms@127.0.0.1:5432/kms

          MYSQL_DATABASE: kms
          MYSQL_ROOT_PASSWORD: kms
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          KMS_MYSQL_URL: mysql://root:kms@localhost:3306/kms

          KMS_SQLITE_PATH: data/shared

          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KMS_REDIS_URL: redis://localhost:6379

          # Google variables
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          set -ex
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} test ${{ matrix.type }}

  test:
    name: Test on ${{ matrix.type }} - ${{ matrix.features }} - without Nix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type:
          - sqlite
          # - mysql
          # - psql
          # - google_cse
          # - redis
          # - pykmip
        features: [fips, non-fips]
        exclude:
          # redis is exclusively for non-fips
          - type: redis
            features: fips

    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run docker containers
        run: |
          docker compose -h
          docker compose up -d

      - name: Test
        env:
          POSTGRES_USER: kms
          PGUSER: kms
          POSTGRES_PASSWORD: kms
          POSTGRES_DB: kms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          KMS_POSTGRES_URL: postgresql://kms:kms@127.0.0.1:5432/kms

          MYSQL_DATABASE: kms
          MYSQL_ROOT_PASSWORD: kms
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          KMS_MYSQL_URL: mysql://root:kms@localhost:3306/kms

          KMS_SQLITE_PATH: data/shared

          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KMS_REDIS_URL: redis://localhost:6379

          # Google variables
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          set -ex
          bash .github/scripts/test_${{ matrix.type }}.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }}

  hsm:
    name: HSM ${{ matrix.hsm-type }} - ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hsm-type:
          - utimaco
          - proteccio
          - softhsm2
        features: [fips, non-fips]
        exclude:
          # parallel connections on proteccio is not supported
          - hsm-type: proteccio
            features: non-fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test
        env:
          # HSM
          PROTECCIO_PASSWORD: ${{ secrets.PROTECCIO_PASSWORD }}
          PROTECCIO_SLOT: ${{ secrets.PROTECCIO_SLOT }}
        run: |
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} test hsm ${{ matrix.hsm-type }}

  windows-2022:
    uses: ./.github/workflows/build_windows.yml
    with:
      toolchain: ${{ inputs.toolchain }}
      archive-name: windows
      debug_or_release: ${{ inputs.debug_or_release }}

  cleanup:
    needs:
      - packages-test
      - test-nix
      - test
      - hsm
      - windows-2022
    uses: ./.github/workflows/cleanup_cache.yml
    secrets: inherit
