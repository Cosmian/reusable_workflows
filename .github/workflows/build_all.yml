---
name: Build all

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      debug_or_release:
        required: true
        type: string
  workflow_dispatch:

jobs:
  packages:
    name: Build package ${{ matrix.package-type }} - ${{ matrix.features }}
    runs-on: ${{ matrix.package-type == 'dmg' && 'macos-15' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        package-type: [deb, rpm, dmg]
        features: [fips, non-fips]
        exclude:
          - package-type: dmg
            features: fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build package
        run: |
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} package ${{ matrix.package-type }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.features }}_${{ matrix.package-type == 'dmg' && 'macos-15' || 'ubuntu-latest' }}-${{ matrix.package-type }}-${{ inputs.debug_or_release}}
          path: result-${{ matrix.package-type }}-${{ matrix.features }}/*.${{ matrix.package-type }}
          retention-days: 1
          if-no-files-found: error

  packages-test:
    needs: packages
    name: Package tests ${{ matrix.container }} - ${{ matrix.features }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          # Ubuntu LTS releases within the last ~10 years
          - ubuntu:25.04
          - ubuntu:24.04
          - ubuntu:22.04
          - ubuntu:20.04
          # Cannot download artifacts using actions/download-artifact@v4 - Glibc v2.28 required
          # - ubuntu:18.04
          # Debian stable releases within the last ~10 years
          - debian:trixie-slim # Debian 13
          - debian:bookworm-slim # Debian 12
          - debian:bullseye-slim # Debian 11
          - debian:buster-slim # Debian 10
          # Cannot download artifacts using actions/download-artifact@v4 - Glibc v2.28 required
          # - debian:stretch-slim # Debian 9
          # Rocky Linux releases
          - rockylinux/rockylinux:10
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:8
        features: [fips, non-fips]

    steps:
      - name: Compute artifact name to download
        id: artifact_name
        shell: bash
        run: |
          set -euo pipefail
          # Determine package type based on distro family
          if [[ "${{ matrix.container }}" == rockylinux/* ]]; then
            pkg_type="rpm"
          else
            pkg_type="deb"
          fi

          # Artifacts for deb/rpm are built on ubuntu-latest
          echo "name=${{ matrix.features }}_ubuntu-latest-${pkg_type}" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts (REST)
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}-${{ inputs.debug_or_release }}

      - name: List downloaded artifacts
        if: ${{ matrix.container != 'rockylinux/rockylinux:8' }}
        run: find .

      - name: Install package
        shell: bash
        run: |
          set -ex
          if [ "${{ startsWith(matrix.container, 'rockylinux') }}" = "true" ]; then
            # RPM-based (Rocky Linux)
            rpm -qpl ./*.rpm
            rpm -i ./*.rpm --nodeps || true
          else
            # DEB-based (Ubuntu/Debian)
            dpkg --contents ./*.deb
            # Use apt to handle dependencies when installing local .deb files
            dpkg -i ./*.deb || true
          fi

      - name: Enable info flag in config
        shell: bash
        run: |
          set -ex
          if [ -f /etc/cosmian/kms.toml ]; then
            sed -i 's/info = false/info = true/g' /etc/cosmian/kms.toml
          else
            echo "Config file /etc/cosmian/kms.toml not found; skipping info flag enable."
            exit 1
          fi

      - name: Run executable file
        shell: bash
        run: |
          set -ex
          # Determine installed binary path
          BIN="/usr/sbin/cosmian_kms"
          if [ ! -x "$BIN" ]; then
            if [ -f "/usr/bin/cosmian_kms" ]; then
              BIN="/usr/bin/cosmian_kms"
            fi
          fi
          # Show libs and run
          ldd "$BIN"
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --info

  packages-test-dmg:
    needs: packages
    name: Test package macos-15 - non-fips
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        features: [non-fips]

    steps:
      - name: Compute artifact name to download (DMG)
        id: artifact_name_dmg
        shell: bash
        run: |
          set -euo pipefail
          echo "name=${{ matrix.features }}_macos-15-dmg" >> "$GITHUB_OUTPUT"

      - name: Download DMG package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_name_dmg.outputs.name }}-${{ inputs.debug_or_release }}

      - name: List downloaded DMG
        run: |
          set -euo pipefail
          ls -lAh
          shasum -a 256 *.dmg || true

      - name: Attach DMG and install pkg
        id: install_pkg
        shell: bash
        run: |
          set -euo pipefail
          DMG_FILE=$(ls -1 *.dmg | head -n1)
          echo "Attaching $DMG_FILE"
          # Attach DMG and capture mount point
          ATTACH_OUT=$(hdiutil attach -nobrowse -readonly "$DMG_FILE")
          echo "$ATTACH_OUT"
          # Grab full mount path (including spaces) by capturing everything after /Volumes/
          MOUNT_POINT=$(printf "%s\n" "$ATTACH_OUT" | sed -n 's|.*\(/Volumes/.*\)$|\1|p' | head -n1)
          if [ -z "$MOUNT_POINT" ]; then
            echo "Failed to determine mount point" >&2
            exit 1
          fi
          echo "Mounted at: $MOUNT_POINT"

          # Find a pkg in the mounted volume
          PKG=$(find "$MOUNT_POINT" -maxdepth 1 -type f -name "*.pkg" -print -quit)
          # Fallback: search one level deeper if not at root
          if [ -z "$PKG" ]; then
            PKG=$(find "$MOUNT_POINT" -maxdepth 2 -type f -name "*.pkg" -print -quit)
          fi
          if [ -z "$PKG" ]; then
            echo "No .pkg found inside DMG at $MOUNT_POINT" >&2
            hdiutil detach "$MOUNT_POINT" || hdiutil detach -force "$MOUNT_POINT" || true
            exit 1
          fi
          echo "Installing package: $PKG"
          sudo installer -pkg "$PKG" -target /

          # Detach after installation
          hdiutil detach "$MOUNT_POINT" || hdiutil detach -force "$MOUNT_POINT" || true

      - name: Enable info flag in config (macOS)
        shell: bash
        run: |
          set -ex
          if [ -f /etc/cosmian/kms.toml ]; then
            sudo sed -i '' -e 's/info = false/info = true/g' /etc/cosmian/kms.toml
          else
            echo "Config file /etc/cosmian/kms.toml not found; skipping info flag enable."
            exit 1
          fi

      - name: Run executable file (macOS)
        shell: bash
        run: |
          set -ex
          # Try common macOS install locations
          CANDIDATES=(
            "/usr/local/sbin/cosmian_kms"
            "/usr/sbin/cosmian_kms"
            "/usr/local/bin/cosmian_kms"
            "/usr/bin/cosmian_kms"
          )
          BIN=""
          for p in "${CANDIDATES[@]}"; do
            if [ -x "$p" ]; then BIN="$p"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "cosmian_kms binary not found in expected locations" >&2
            exit 1
          fi
          echo "Using binary: $BIN"
          otool -L "$BIN" || true
          "$BIN" --version
          "$BIN" --info

  test:
    name: Test on ${{ matrix.type }} - ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type:
          - sqlite
          - mysql
          - psql
          - google_cse
          - redis
        features: [fips, non-fips]
        exclude:
          # redis is exclusively for non-fips
          - type: redis
            features: fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run docker containers
        run: |
          docker compose -h
          docker compose up -d

      - name: Test
        env:
          POSTGRES_USER: kms
          PGUSER: kms
          POSTGRES_PASSWORD: kms
          POSTGRES_DB: kms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          KMS_POSTGRES_URL: postgresql://kms:kms@127.0.0.1:5432/kms

          MYSQL_DATABASE: kms
          MYSQL_ROOT_PASSWORD: kms
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          KMS_MYSQL_URL: mysql://root:kms@localhost:3306/kms

          KMS_SQLITE_PATH: data/shared

          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KMS_REDIS_URL: redis://localhost:6379

          # Google variables
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} test ${{ matrix.type }}

  hsm:
    name: HSM ${{ matrix.hsm-type }} - ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hsm-type:
          - utimaco
          - proteccio
          - softhsm2
        features: [fips, non-fips]
        exclude:
          # parallel connections on proteccio is not supported
          - hsm-type: proteccio
            features: non-fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test
        env:
          # HSM
          PROTECCIO_PASSWORD: ${{ secrets.PROTECCIO_PASSWORD }}
          PROTECCIO_SLOT: ${{ secrets.PROTECCIO_SLOT }}
        run: |
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} test hsm ${{ matrix.hsm-type }}

  windows-2022:
    uses: ./.github/workflows/build_windows.yml
    with:
      toolchain: ${{ inputs.toolchain }}
      archive-name: windows
      debug_or_release: ${{ inputs.debug_or_release }}

  cleanup:
    needs:
      - packages-test
      - packages-test-dmg
      - test
      - windows-2022
    uses: ./.github/workflows/cleanup_cache.yml
    secrets: inherit
