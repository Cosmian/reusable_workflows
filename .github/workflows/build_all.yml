---
name: Build all

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      debug_or_release:
        required: true
        type: string
  workflow_dispatch:

jobs:
  packages:
    name: Build packages ${{ matrix.package-type }} ${{ matrix.features && format('({0})', matrix.features) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package-type: dmg
            artifact-name: macos_arm
            artifact-path: target/${{ inputs.debug_or_release }}/*.dmg
            features: non-fips

          - os: ubuntu-22.04
            package-type: deb
            artifact-name: fips_ubuntu_22_04
            artifact-path: target/debian/*.deb

          - os: ubuntu-22.04
            package-type: deb
            artifact-name: ubuntu_22_04
            artifact-path: target/debian/*.deb
            features: non-fips

          - os: ubuntu-22.04
            package-type: rpm
            artifact-name: ubuntu_22_04_rpm
            artifact-path: target/generate-rpm/*.rpm
            features: non-fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build packages
        env:
          DEBUG_OR_RELEASE: ${{ inputs.debug_or_release }}
        run: |
          ${{ matrix.features && format('export FEATURES={0}', matrix.features) || '' }}
          bash .github/scripts/nix.sh package ${{ matrix.package-type }}

      - name: Upload for ${{ matrix.os }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ inputs.debug_or_release }}
          path: |
            ${{ matrix.artifact-path }}
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test ${{ matrix.type }} ${{ matrix.features && format('({0})', matrix.features) || '' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: sqlite
          - type: mysql
          - type: psql
          - type: redis
          - type: google_cse
          - type: hsm
          - type: sqlite
            features: non-fips
          - type: mysql
            features: non-fips
          - type: psql
            features: non-fips
          - type: redis
            features: non-fips
          - type: google_cse
            features: non-fips
          - type: hsm
            features: non-fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run docker containers
        run: |
          docker compose -h
          docker compose up -d

      - name: Test
        env:
          DEBUG_OR_RELEASE: ${{ inputs.debug_or_release }}
        run: |
          ${{ matrix.features && format('export FEATURES={0}', matrix.features) || '' }}
          bash .github/scripts/nix.sh test ${{ matrix.type }}

  windows-2022:
    uses: ./.github/workflows/build_windows.yml
    with:
      toolchain: ${{ inputs.toolchain }}
      archive-name: windows
      debug_or_release: ${{ inputs.debug_or_release }}

  cleanup:
    needs:
      - packages
      - test
      - windows-2022
    uses: ./.github/workflows/cleanup_cache.yml
    secrets: inherit
