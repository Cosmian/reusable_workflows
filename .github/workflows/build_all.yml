---
name: Build all

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      debug_or_release:
        required: true
        type: string
  workflow_dispatch:

jobs:
  packages:
    name: Build package ${{ matrix.package-type }} - ${{ matrix.features }}
    runs-on: ${{ matrix.package-type == 'dmg' && 'macos-15' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        package-type: [deb, rpm, dmg]
        features: [fips, non-fips]
        exclude:
          - package-type: dmg
            features: fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build package
        run: |
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} package ${{ matrix.package-type }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.features }}_${{ matrix.package-type == 'dmg' && 'macos-15' || 'ubuntu-latest' }}-${{ matrix.package-type }}-${{ inputs.debug_or_release}}
          path: result-${{ matrix.package-type }}-${{ matrix.features }}/*.${{ matrix.package-type }}
          retention-days: 1
          if-no-files-found: error

  packages-test:
    needs: packages
    name: Test package ${{ matrix.container }} - ${{ matrix.features }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container:
          # Ubuntu LTS releases within the last ~10 years
          - ubuntu:25.04
          - ubuntu:24.04
          - ubuntu:22.04
          - ubuntu:20.04
          - ubuntu:18.04
          # Debian stable releases within the last ~10 years
          - debian:trixie-slim # Debian 13
          - debian:bookworm-slim # Debian 12
          - debian:bullseye-slim # Debian 11
          - debian:buster-slim # Debian 10
          - debian:stretch-slim # Debian 9
          # Rocky Linux releases
          - rockylinux/rockylinux:10
          - rockylinux/rockylinux:9
          - rockylinux/rockylinux:8
        features: [fips, non-fips]

    steps:
      - name: Compute artifact name to download
        id: artifact_name
        shell: bash
        run: |
          set -euo pipefail
          # Determine package type based on distro family
          if [[ "${{ matrix.container }}" == rockylinux/* ]]; then
            pkg_type="rpm"
          else
            pkg_type="deb"
          fi

          # Artifacts for deb/rpm are built on ubuntu-latest
          echo "name=${{ matrix.features }}_ubuntu-latest-${pkg_type}" >> "$GITHUB_OUTPUT"

      - name: Install curl, jq, unzip
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates jq unzip
          elif command -v dnf >/dev/null 2>&1; then
            dnf -y install curl ca-certificates jq unzip || {
              dnf makecache -y
              dnf -y install curl ca-certificates jq unzip
            }
          elif command -v yum >/dev/null 2>&1; then
            yum -y install curl ca-certificates jq unzip
          else
            echo "No supported package manager found (apt, dnf, yum)."
            exit 1
          fi

      - name: Download package artifacts (REST)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.artifact_name.outputs.name }}-${{ inputs.debug_or_release }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing GH_TOKEN}"

          # Human-readable variables
          OWNER="${REPOSITORY%/*}"
          REPO="${REPOSITORY#*/}"
          API="https://api.github.com"

          echo "Artifact to download: ${ARTIFACT_NAME}"
          echo "From run: ${RUN_ID} (repo: ${OWNER}/${REPO})"

          # List artifacts for this run and find the ID of the named artifact
          TMP_JSON="$(mktemp)"
          curl -sSfL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/repos/${OWNER}/${REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > "$TMP_JSON"

          ARTIFACT_ID=$(jq -r --arg NAME "$ARTIFACT_NAME" \
            '.artifacts[] | select(.name == $NAME) | .id' "$TMP_JSON" | head -n1)

          if [ -z "${ARTIFACT_ID}" ] || [ "${ARTIFACT_ID}" = "null" ]; then
            echo "Artifact '${ARTIFACT_NAME}' not found. Available artifacts in this run:"
            jq -r '.artifacts[].name' "$TMP_JSON" || true
            exit 1
          fi

          echo "Downloading artifact id: ${ARTIFACT_ID}"
          curl -sSfL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/repos/${OWNER}/${REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact.zip

          echo "Extracting..."
          unzip -o artifact.zip
          rm -f artifact.zip "$TMP_JSON"

      - name: List downloaded artifacts
        if: ${{ matrix.container != 'rockylinux/rockylinux:8' }}
        run: find .

      - name: Install package
        shell: bash
        run: |
          set -ex
          if [ "${{ startsWith(matrix.container, 'rockylinux') }}" = "true" ]; then
            # RPM-based (Rocky Linux)
            rpm -qpl ./*.rpm
            rpm -i ./*.rpm --nodeps || true
          else
            # DEB-based (Ubuntu/Debian)
            dpkg --contents ./*.deb
            # Use apt to handle dependencies when installing local .deb files
            dpkg -i ./*.deb || true
          fi

      - name: Enable info flag in config
        shell: bash
        run: |
          set -ex
          if [ -f /etc/cosmian/kms.toml ]; then
            sed -i 's/info = false/info = true/g' /etc/cosmian/kms.toml
          else
            echo "Config file /etc/cosmian/kms.toml not found; skipping info flag enable."
            exit 1
          fi

      - name: Run executable file
        shell: bash
        run: |
          set -ex
          # Determine installed binary path
          BIN="/usr/sbin/cosmian_kms"
          if [ ! -x "$BIN" ]; then
            if [ -f "/usr/bin/cosmian_kms" ]; then
              BIN="/usr/bin/cosmian_kms"
            fi
          fi
          # Show libs and run
          ldd "$BIN"
          chmod +x "$BIN"
          "$BIN" --version
          "$BIN" --info

  test:
    name: Test on ${{ matrix.type }} - ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type:
          - sqlite
          - mysql
          - psql
          - google_cse
          - redis
        features: [fips, non-fips]
        exclude:
          # redis is exclusively for non-fips
          - type: redis
            features: fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run docker containers
        run: |
          docker compose -h
          docker compose up -d

      - name: Test
        env:
          POSTGRES_USER: kms
          PGUSER: kms
          POSTGRES_PASSWORD: kms
          POSTGRES_DB: kms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          KMS_POSTGRES_URL: postgresql://kms:kms@127.0.0.1:5432/kms

          MYSQL_DATABASE: kms
          MYSQL_ROOT_PASSWORD: kms
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          KMS_MYSQL_URL: mysql://root:kms@localhost:3306/kms

          KMS_SQLITE_PATH: data/shared

          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KMS_REDIS_URL: redis://localhost:6379

          # Google variables
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} test ${{ matrix.type }}

  hsm:
    name: HSM ${{ matrix.hsm-type }} - ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hsm-type:
          - utimaco
          - proteccio
          - softhsm2
        features: [fips]

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test
        env:
          # HSM
          PROTECCIO_PASSWORD: ${{ secrets.PROTECCIO_PASSWORD }}
          PROTECCIO_SLOT: ${{ secrets.PROTECCIO_SLOT }}
        run: |
          bash .github/scripts/nix.sh --profile ${{ inputs.debug_or_release }} --variant ${{ matrix.features }} test hsm ${{ matrix.hsm-type }}

  windows-2022:
    uses: ./.github/workflows/build_windows.yml
    with:
      toolchain: ${{ inputs.toolchain }}
      archive-name: windows
      debug_or_release: ${{ inputs.debug_or_release }}

  cleanup:
    needs:
      - packages-test
      - test
      - windows-2022
    uses: ./.github/workflows/cleanup_cache.yml
    secrets: inherit
