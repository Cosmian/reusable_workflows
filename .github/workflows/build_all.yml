---
name: Build all

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      debug_or_release:
        required: true
        type: string
  workflow_dispatch:

jobs:
  packages:
    name: Build package ${{ matrix.package-type }} ${{ matrix.features && format('({0})', matrix.features) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package-type: dmg
            artifact-name: macos_arm
            artifact-path: target/${{ inputs.debug_or_release }}/*.dmg
            features: non-fips

          - os: ubuntu-22.04
            package-type: deb
            artifact-name: fips_ubuntu_22_04
            artifact-path: target/debian/*.deb

          - os: ubuntu-22.04
            package-type: deb
            artifact-name: ubuntu_22_04
            artifact-path: target/debian/*.deb
            features: non-fips

          - os: ubuntu-22.04
            package-type: rpm
            artifact-name: ubuntu_22_04_rpm
            artifact-path: target/generate-rpm/*.rpm
            features: non-fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build package
        env:
          DEBUG_OR_RELEASE: ${{ inputs.debug_or_release }}
        run: |
          ${{ matrix.features && format('export FEATURES={0}', matrix.features) || '' }}
          bash .github/scripts/nix.sh package ${{ matrix.package-type }}

      - name: Install package
        shell: bash
        run: |
          if [ "${{ matrix.package-type }}" = "deb" ]; then
            dpkg --contents ./target/debian/*.deb
            sudo dpkg -i ./target/debian/*.deb
            dpkg -L cosmian-kms-server
          elif [ "${{ matrix.package-type }}" = "rpm" ]; then
            rpm -qpl ./target/generate-rpm/*.rpm
            sudo rpm -i ./target/generate-rpm/*.rpm --nodeps
            rpm -ql cosmian_kms_server
          fi

      - name: Fix permissions
        run: |
          if [ "${{ matrix.package-type }}" = "deb" ] || [ "${{ matrix.package-type }}" = "rpm" ]; then
            sudo chmod +x /usr/sbin/cosmian_kms || true
            sudo chmod +x /usr/sbin/cosmian || true
            sudo chmod +x /usr/sbin/cosmian_findex_server || true

            sudo chmod 644 /etc/cosmian/kms.toml || true
            sudo chmod 644 /usr/local/lib/openssl/openssl.cnf || true
            sudo chmod 644 /usr/local/lib/openssl/fipsmodule.cnf || true
            sudo chmod +x /usr/local/lib/openssl/ossl-modules/fips.so || true
            sudo chmod +x /usr/local/lib/openssl/ossl-modules/legacy.so || true
          fi

      - name: Run executable file
        run: |
          if [ "${{ matrix.package-type }}" = "deb" ] || [ "${{ matrix.package-type }}" = "rpm" ]; then
            # cosmian --version
            cosmian_kms --info
            # cosmian_findex_server --version
          fi

      - name: Upload for ${{ matrix.os }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-${{ inputs.debug_or_release }}
          path: |
            ${{ matrix.artifact-path }}
          retention-days: 1
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.type }} ${{ matrix.features && format('({0})', matrix.features) || '' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: sqlite
          - type: mysql
          - type: psql
          # - type: redis # exclusively for non-fips
          - type: google_cse
          - type: hsm
          - type: sqlite
            features: non-fips
          - type: mysql
            features: non-fips
          - type: psql
            features: non-fips
          - type: redis
            features: non-fips
          - type: google_cse
            features: non-fips
          - type: hsm
            features: non-fips

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run docker containers
        run: |
          docker compose -h
          docker compose up -d

      - name: Test
        env:
          DEBUG_OR_RELEASE: ${{ inputs.debug_or_release }}
          POSTGRES_USER: kms
          PGUSER: kms
          POSTGRES_PASSWORD: kms
          POSTGRES_DB: kms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          KMS_POSTGRES_URL: postgresql://kms:kms@127.0.0.1:5432/kms

          MYSQL_DATABASE: kms
          MYSQL_ROOT_PASSWORD: kms
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          KMS_MYSQL_URL: mysql://root:kms@localhost:3306/kms

          KMS_SQLITE_PATH: data/shared

          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KMS_REDIS_URL: redis://localhost:6379

          # Google variables
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          ${{ matrix.features && format('export FEATURES={0}', matrix.features) || '' }}
          bash .github/scripts/nix.sh test ${{ matrix.type }}

  windows-2022:
    uses: ./.github/workflows/build_windows.yml
    with:
      toolchain: ${{ inputs.toolchain }}
      archive-name: windows
      debug_or_release: ${{ inputs.debug_or_release }}

  cleanup:
    needs:
      - packages
      - test
      - windows-2022
    uses: ./.github/workflows/cleanup_cache.yml
    secrets: inherit
