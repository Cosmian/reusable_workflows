---
name: Build all

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
      debug_or_release:
        required: true
        type: string
  workflow_dispatch:

jobs:
  linux-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: ubuntu-24.04
            archive-name: fips_ubuntu_24_04
            docker_compose: true

          - distribution: ubuntu-24.04
            archive-name: ubuntu_24_04
            docker_compose: true
            features: non-fips

          - distribution: macos-15
            archive-name: macos_arm
            docker_compose: false
            features: non-fips

    name: ${{ matrix.distribution }}
    uses: ./.github/workflows/build_generic.yml
    secrets: inherit
    with:
      toolchain: ${{ inputs.toolchain }}
      distribution: ${{ matrix.distribution }}
      archive-name: ${{ matrix.archive-name }}
      debug_or_release: ${{ inputs.debug_or_release }}
      features: ${{ matrix.features }}
      docker_compose: ${{ matrix.docker_compose }}

  windows-2022:
    uses: ./.github/workflows/build_windows.yml
    with:
      toolchain: ${{ inputs.toolchain }}
      archive-name: windows
      debug_or_release: ${{ inputs.debug_or_release }}

  cleanup:
    needs:
      - linux-mac
      - windows-2022
    uses: ./.github/workflows/cleanup_cache.yml
    secrets: inherit
