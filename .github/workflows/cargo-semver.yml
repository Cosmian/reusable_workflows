---
name: Cargo semver

on:
  workflow_call:

jobs:
  semver:
    name: check semver
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up cargo cache
        uses: actions/cache@v3
        id: github-cache
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-semver-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}-checks-0.51.0
          restore-keys: ${{ runner.os }}-cargo-semver-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}-checks-0.51.0

      - uses: Cosmian/reusable_workflows/.github/actions/install-rust@develop

      - name: Install semver
        if: steps.github-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.51.0 cargo-semver-checks

      - name: Verify semver integrity
        run: cargo semver-checks check-release --baseline-root=. --all-features
