---
name: Push artifacts to package.cosmian.com

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      destination:
        required: true
        type: string
      debug_or_release:
        required: true
        type: string

jobs:
  ##############################################################################
  ### Packages
  ##############################################################################
  packages:
    name: push ${{ inputs.project-name }} to package.cosmian.com
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    env:
      ARCHIVE_NAMES: >-
        fips_ubuntu-24.04-${{ inputs.debug_or_release }}
        non-fips_ubuntu-24.04-${{ inputs.debug_or_release }}
        fips_ubuntu-24.04-arm-${{ inputs.debug_or_release }}
        non-fips_ubuntu-24.04-arm-${{ inputs.debug_or_release }}
        non-fips_macos-15-${{ inputs.debug_or_release }}
        windows-${{ inputs.debug_or_release }}


    steps:
      - run: rm -rf ${{ inputs.project-name }}_* fips_* windows* ubuntu* macos* rockylinux* debian*
      - uses: actions/download-artifact@v4
        with:
          pattern: '*fips*'
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*

      - run: find .

      - name: Creating zip to be attached to release
        shell: bash
        run: |
          set -xe
          apt update -y
          apt-get install -y zip

          for archive_name in $ARCHIVE_NAMES; do
            zip -r "$archive_name.zip" "$archive_name"
          done

      - name: Push to package.cosmian.com
        shell: bash
        run: |
          set -ex
          if [[ "${GITHUB_REF}" =~ 'refs/tags/' ]]; then
            BRANCH="${GITHUB_REF_NAME}"
          else
            BRANCH="last_build/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi
          DESTINATION_DIR=/mnt/package/${{ inputs.destination }}/$BRANCH
          ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa cosmian@package.cosmian.com mkdir -p $DESTINATION_DIR
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa *.zip cosmian@package.cosmian.com:$DESTINATION_DIR/
          # Debian and RPM packages (x86_64 & ARM) - copy all deb/rpm from unified dirs
          for dir in fips_ubuntu-24.04-${{ inputs.debug_or_release }} \
                     non-fips_ubuntu-24.04-${{ inputs.debug_or_release }} \
                     fips_ubuntu-24.04-arm-${{ inputs.debug_or_release }} \
                     non-fips_ubuntu-24.04-arm-${{ inputs.debug_or_release }}; do
            if compgen -G "$dir/*.deb*" > /dev/null; then
              scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa $dir/*.deb* cosmian@package.cosmian.com:$DESTINATION_DIR/ || true
            fi
            if compgen -G "$dir/*.rpm*" > /dev/null; then
              scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa $dir/*.rpm* cosmian@package.cosmian.com:$DESTINATION_DIR/ || true
            fi
          done

          # macOS packages (DMG non-FIPS)
          if compgen -G "non-fips_macos-15-${{ inputs.debug_or_release }}/*.dmg*" > /dev/null; then
            scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
              non-fips_macos-15-${{ inputs.debug_or_release }}/*.dmg* \
              cosmian@package.cosmian.com:$DESTINATION_DIR/
          fi

          # Windows EXE packages
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            windows-${{ inputs.debug_or_release }}/*.exe \
            cosmian@package.cosmian.com:$DESTINATION_DIR/

      - name: Fail if no multiple arch Debian/RPM packages are not found
        shell: bash
        run: |
          set -ex
          DEB_COUNT=0
          RPM_COUNT=0
          for dir in fips_ubuntu-24.04-${{ inputs.debug_or_release }} \
                     non-fips_ubuntu-24.04-${{ inputs.debug_or_release }} \
                     fips_ubuntu-24.04-arm-${{ inputs.debug_or_release }} \
                     non-fips_ubuntu-24.04-arm-${{ inputs.debug_or_release }}; do
            DEB_COUNT=$((DEB_COUNT + $(compgen -G "$dir/*.deb*" | wc -l || true)))
            RPM_COUNT=$((RPM_COUNT + $(compgen -G "$dir/*.rpm*" | wc -l || true)))
          done

          if [ "$DEB_COUNT" -lt 2 ] && [ "$RPM_COUNT" -lt 2 ]; then
            echo "Error: Less than two architecture-specific Debian or RPM packages found."
            exit 1
          fi

      - name: Fail if no Windows executable is found
        shell: bash
        run: |
          set -ex
          EXE_COUNT=$(compgen -G "windows-${{ inputs.debug_or_release }}/*.exe" | wc -l || true)

          if [ "$EXE_COUNT" -lt 1 ]; then
            echo "Error: No Windows executable found."
            exit 1
          fi

      - name: Fail if no macOS DMG package is found
        shell: bash
        run: |
          set -ex
          DMG_COUNT=$(compgen -G "non-fips_macos-15-${{ inputs.debug_or_release }}/*.dmg*" | wc -l || true)

          if [ "$DMG_COUNT" -lt 1 ]; then
            echo "Error: No macOS DMG package found."
            exit 1
          fi

      - name: Release on tags, attach asset on release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            non-fips_ubuntu-*/*.deb*
            fips_ubuntu-*/*.deb*
            non-fips_ubuntu-*/*.rpm*
            fips_ubuntu-*/*.rpm*
            non-fips_macos-15-*/*.dmg*
            windows-*/*.exe
