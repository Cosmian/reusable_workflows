---
name: Push artifacts to package.cosmian.com

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      destination:
        required: true
        type: string
      debug_or_release:
        required: true
        type: string

jobs:
  ##############################################################################
  ### Packages
  ##############################################################################
  packages:
    name: push ${{ inputs.project-name }} to package.cosmian.com
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    env:
      ARCHIVE_NAMES: >-
        fips_ubuntu-latest-deb-${{ inputs.debug_or_release }}
        non-fips_ubuntu-latest-deb-${{ inputs.debug_or_release }}
        fips_ubuntu-latest-rpm-${{ inputs.debug_or_release }}
        non-fips_ubuntu-latest-rpm-${{ inputs.debug_or_release }}
        non-fips_macos-15-dmg-${{ inputs.debug_or_release }}
        windows-${{ inputs.debug_or_release }}


    steps:
      - run: rm -rf ${{ inputs.project-name }}_* fips_* windows* ubuntu* macos* rockylinux* debian*
      - uses: actions/download-artifact@v4

      - run: find .

      - name: Creating zip to be attached to release
        shell: bash
        run: |
          set -xe
          apt update -y
          apt-get install -y zip

          for archive_name in $ARCHIVE_NAMES; do
            zip -r "$archive_name.zip" "$archive_name"
          done

      - name: Push to package.cosmian.com
        shell: bash
        run: |
          set -ex
          if [[ "${GITHUB_REF}" =~ 'refs/tags/' ]]; then
            BRANCH="${GITHUB_REF_NAME}"
          else
            BRANCH="last_build/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi
          DESTINATION_DIR=/mnt/package/${{ inputs.destination }}/$BRANCH
          ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa cosmian@package.cosmian.com mkdir -p $DESTINATION_DIR
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa *.zip cosmian@package.cosmian.com:$DESTINATION_DIR/

          # Debian packages (non-FIPS and FIPS)
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            non-fips_ubuntu-latest-deb-${{ inputs.debug_or_release }}/*.deb \
            cosmian@package.cosmian.com:$DESTINATION_DIR/
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            fips_ubuntu-latest-deb-${{ inputs.debug_or_release }}/*.deb \
            cosmian@package.cosmian.com:$DESTINATION_DIR/

          # RPM packages (non-FIPS and FIPS)
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            non-fips_ubuntu-latest-rpm-${{ inputs.debug_or_release }}/*.rpm \
            cosmian@package.cosmian.com:$DESTINATION_DIR/
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            fips_ubuntu-latest-rpm-${{ inputs.debug_or_release }}/*.rpm \
            cosmian@package.cosmian.com:$DESTINATION_DIR/

          # macOS DMG packages (non-FIPS)
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            non-fips_macos-15-dmg-${{ inputs.debug_or_release }}/*.dmg \
            cosmian@package.cosmian.com:$DESTINATION_DIR/

          # Windows EXE packages
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            windows-${{ inputs.debug_or_release }}/*.exe \
            cosmian@package.cosmian.com:$DESTINATION_DIR/

      - name: Release on tags, attach asset on release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            non-fips_ubuntu-latest-deb-${{ inputs.debug_or_release }}/*.deb
            fips_ubuntu-latest-deb-${{ inputs.debug_or_release }}/*.deb
            non-fips_ubuntu-latest-rpm-${{ inputs.debug_or_release }}/*.rpm
            fips_ubuntu-latest-rpm-${{ inputs.debug_or_release }}/*.rpm
            non-fips_macos-15-dmg-${{ inputs.debug_or_release }}/*.dmg
            windows-${{ inputs.debug_or_release }}/*.exe
