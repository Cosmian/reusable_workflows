---
name: Cargo nursery base

on:
  workflow_call:
    inputs:
      exclusions:
        required: false
        type: string
        default: ''

jobs:
  cargo-lint:
    uses: ./.github/workflows/cargo-lint.yml
    with:
      exclusions: ${{ inputs.exclusions }}
  cargo-fmt:
    uses: ./.github/workflows/cargo-fmt.yml
  cargo-audit:
    uses: ./.github/workflows/cargo-audit.yml
  cargo-machete:
    uses: ./.github/workflows/cargo-machete.yml
