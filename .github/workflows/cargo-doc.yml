---
name: Cargo doc

on:
  workflow_call:
    inputs:
      exclusions:
        required: false
        type: string
        default: ''

jobs:
  doc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Cosmian/reusable_workflows/.github/actions/install-rust@develop

      - name: Check doc
        run: cargo doc --all-features --workspace ${{ inputs.exclusions }}

      - name: Run doc tests
        run: cargo test --release --workspace ${{ inputs.exclusions }} --all-features --doc
